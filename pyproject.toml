[project]
name = "units-t"
version = "0.1.0"
description = "Unit conversion and dimensional analysis, traced all the way down to fundamental constants."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Harmon", email = "aharmon256@gmail.com" }]
keywords = ["units", "unit conversion", "dimensional analysis", "physical constants", "SI", "CODATA"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/units_t"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["units_t"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# README examples use column-aligned output comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Unit symbols like `u.J` look like constants to SIM300 but are not Yoda conditions.
ignore = ["SIM300"]
# Unit symbols and physics notation are deliberately non-ASCII.
allowed-confusables = ["×", "−", "′", "α", "γ", "σ"]

[tool.mypy]
strict = true
files = ["src", "tests"]
